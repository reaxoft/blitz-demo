{
    "handlers": {
        "exchange" : {
            "type" : "token-exchange",
            "required-scopes": ["openid"],
            "cache-capacity" : 0,
            "te" : "http://blitz-idp:9000/blitz/oauth/te"
        }
    },
    "services" : {
        "test-services" : {
            "display-name" : "test-services",
            "host" : "test.services.loc",
            "locations" : {
                "/test-services/*" : {
                    "reverse-proxy": {
                      "proxy-pass": "http://test.services.loc",
                    },
                    "handler": "exchange",
                    "methods": ["get","post","delete"]
                }
            }
        }
    },
    "proxy": {
        "max-request-buffer-size-in-bytes": 0,
        "port" : 9012
    },
    "integrations": {},
    "audit" : {
        "settings" : {
            "emitters" : [
                {
                    "typ": "log"
                }
            ]
        }
    }
}